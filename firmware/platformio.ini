; PlatformIO project for the O2 analyzer firmware (ESP32-2424S012 / ESP32-C3)
[platformio]
src_dir = O2_Analyzer

[env:esp32-2424s012]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    adafruit/Adafruit ADS1X15@^2.5.0
